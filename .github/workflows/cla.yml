name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/signatures/cla.json'
          path-to-cla-document: 'CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot]'
          create-file-commit-message: 'chore: update CLA signatures'
          signed-commit-message: 'chore: $contributorName has signed the CLA'
